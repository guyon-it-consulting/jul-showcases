<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SkyDemo — Flight Search</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px;
         margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { font-size: 22px; }
  .card { border: 1px solid #ddd; border-radius: 12px; padding: 20px; margin: 16px 0; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc;
                  border-radius: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 18px; font-size: 15px; border: 0;
           border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
  button.secondary { background: #e5e7eb; color: #111; }
  .hidden { display: none; }
  .result { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; margin: 8px 0; }
  .trip-toggle button { margin-right: 8px; }
  .trip-toggle button.active { outline: 2px solid #2563eb; }
</style>
</head>
<body>
<h1>SkyDemo Flights</h1>

<!-- Step 1: search form -->
<div class="card" id="search-card">
  <div class="trip-toggle">
    <button id="btn-oneway" class="secondary">One-way</button>
    <button id="btn-round" class="secondary active">Round trip</button>
  </div>

  <label for="from">Where from?</label>
  <input id="from" name="from" placeholder="Origin city" autocomplete="off">

  <label for="to">Where to?</label>
  <input id="to" name="to" placeholder="Destination city" autocomplete="off">

  <label for="cabin">Cabin class</label>
  <select id="cabin" name="cabin">
    <option value="">Select…</option>
    <option value="economy">Economy</option>
    <option value="premium">Premium economy</option>
    <option value="business">Business</option>
    <option value="first">First</option>
  </select>

  <button id="search">Search flights</button>
</div>

<!-- Step 2: results (revealed after search) -->
<div class="card hidden" id="results-card">
  <h2 id="results-title">Flight results</h2>
  <div id="results-list"></div>
</div>

<script>
  let trip = "round";
  document.getElementById("btn-oneway").onclick = () => {
    trip = "oneway";
    document.getElementById("btn-oneway").classList.add("active");
    document.getElementById("btn-round").classList.remove("active");
  };
  document.getElementById("btn-round").onclick = () => {
    trip = "round";
    document.getElementById("btn-round").classList.add("active");
    document.getElementById("btn-oneway").classList.remove("active");
  };

  document.getElementById("search").onclick = () => {
    const from = document.getElementById("from").value.trim();
    const to = document.getElementById("to").value.trim();
    const cabin = document.getElementById("cabin").value;
    if (!from || !to || !cabin) return;   // require a complete form

    const list = document.getElementById("results-list");
    list.innerHTML = "";
    const airlines = ["SkyJet", "AeroNova", "BlueWing"];
    airlines.forEach((a, i) => {
      const div = document.createElement("div");
      div.className = "result";
      div.setAttribute("data-flight", i);
      div.textContent = `${a}: ${from} → ${to} (${cabin}, ${trip}) — $${180 + i * 45}`;
      list.appendChild(div);
    });
    document.getElementById("results-title").textContent =
      `Flights ${from} → ${to}`;
    document.getElementById("results-card").classList.remove("hidden");
    document.body.setAttribute("data-page", "results");
  };
</script>
</body>
</html>
